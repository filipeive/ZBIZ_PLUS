<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" fill="none">
  <!-- Option 1: Dynamic Prism (Z facetada com o sinal + integrado e wordmark moderna) -->
  <g id="icon" transform="translate(6, 6)">
    <!-- Base Rounded Square com sombra sutil -->
    <rect width="48" height="48" rx="14" fill="#0f172a"/>
    <!-- Prisma Z em verde esmeralda vibrante -->
    <path d="M14 16H34L20 32H34" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Plus distintivo em verde claro -->
    <path d="M32 20V28M28 24H36" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <circle cx="15" cy="32" r="2.5" fill="#10b981"/>
  </g>
  <!-- Wordmark -->
  <text x="68" y="38" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="26" font-weight="900" letter-spacing="-0.5" fill="#0f172a">
    ZBIZ<tspan fill="#10b981">+</tspan>
  </text>
  <text x="69" y="49" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.8" fill="#64748b" text-transform="uppercase">
    GESTÃO &amp; POS
  </text>
</svg>
