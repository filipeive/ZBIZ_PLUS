services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zbizplus_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      - APP_NAME=ZBIZ+
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-zbizplus_db}
      - DB_USERNAME=${DB_USERNAME:-zbiz_user}
      - DB_PASSWORD=${DB_PASSWORD:-zbiz_secret_pass}
      - SESSION_DRIVER=database
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zbiz_network

  db:
    image: mysql:8.0
    container_name: zbizplus_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-zbizplus_db}
      MYSQL_USER: ${DB_USERNAME:-zbiz_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-zbiz_secret_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_password}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u ${DB_USERNAME:-zbiz_user} -p${DB_PASSWORD:-zbiz_secret_pass} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - zbiz_network

volumes:
  db_data:
    driver: local
  app_storage:
    driver: local

networks:
  zbiz_network:
    driver: bridge
